services:
  backend:
    build:
      context: .
      dockerfile: webapp/Dockerfile.backend
    ports:
      - "8000:8000"
    # Local secrets such as QUOTA_ADMIN_KEY, read at run time (never baked
    # into the image). Optional, so the stack still starts without it.
    env_file:
      - path: webapp/backend/.env
        required: false
    environment:
      - DJANGO_DEBUG=False
      - DJANGO_ALLOWED_HOSTS=*
      - DJANGO_SECRET_KEY=${DJANGO_SECRET_KEY:-local-docker-only-change-me}
    restart: unless-stopped

  frontend:
    build:
      context: webapp/frontend
      dockerfile: ../Dockerfile.frontend
    ports:
      - "5173:80"
    depends_on:
      - backend
    restart: unless-stopped
