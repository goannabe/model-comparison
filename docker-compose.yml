services:
  backend:
    build:
      context: .
      dockerfile: webapp/Dockerfile.backend
    ports:
      - "8000:8000"
    environment:
      - DJANGO_DEBUG=False
      - DJANGO_ALLOWED_HOSTS=*
      - DJANGO_SECRET_KEY=${DJANGO_SECRET_KEY:-local-docker-only-change-me}
    restart: unless-stopped

  frontend:
    build:
      context: webapp/frontend
      dockerfile: ../Dockerfile.frontend
    ports:
      - "5173:80"
    depends_on:
      - backend
    restart: unless-stopped
